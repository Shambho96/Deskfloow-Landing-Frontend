version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Ensure Node 20+ is active for Next.js 16
        - nvm use 20 || nvm install 20
        - node -v
        # Fast, clean, cached dependency installation
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Inject any Amplify console environment variables into production build
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
