<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="16" y1="16" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="40" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Icon -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Glowing Interior Room Light inside D -->
  <path d="M18 16 H30 C38 16 42 22 42 30 C42 38 38 44 30 44 H18 V16 Z" fill="#2E1065"/>
  <rect x="22" y="20" width="14" height="18" rx="3" fill="url(#goldGlow)"/>
  
  <!-- Stylized Bed & Lamp -->
  <rect x="24" y="27" width="10" height="9" rx="1.5" fill="#7C3AED"/>
  <circle cx="29" cy="24" r="2" fill="#FEF3C7"/>
  
  <!-- Outer D Curve White Highlight -->
  <path d="M18 14 H30 C40 14 46 21 46 30 C46 39 40 46 30 46 H18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Dynamic swoosh wave at bottom -->
  <path d="M6 52 C18 42 34 56 58 46" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
  <path d="M6 56 C20 47 38 60 58 50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Checkmark badge -->
  <circle cx="50" cy="46" r="6" fill="#F59E0B"/>
  <path d="M47.5 46 L49.5 48 L53 44" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
